# gaffer — feature sequencing (plugin ADR 0020 D2)
# ---------------------------------------------------------------------------
# gspec owns WHAT to build: everything about a feature lives in its own folder
# (`gspec/features/<slug>/` — `prd.md` and `tasks.md`, plus `arch.md` and
# `design.html` where they exist). It has no CROSS-feature ordering, so this file
# supplies it.
#
# It lives here and NOT under `gspec/` on purpose: gspec's spec-integrity floor
# governs every `.md` under `gspec/` and would flag a file gspec does not own.
#
# Read through the adapter, never by hand:
#   scripts/gspec-backlog.sh next
#   scripts/gspec-backlog.sh features
#
# ADOPTION NOTE. This backlog is FORWARD-ONLY plus one retro-spec. The 25 ADRs of
# already-shipped work are not retro-specced — that is archaeology over decisions
# that already have passing sweeps. `run-metrics` is the single exception, because
# ADR 0019's five stacked `v3.x` revision sections were the clearest case of a
# decision record being used as a status tracker.
#
# DO NOT add `status`. It is DERIVED:
#   completion  -> every capability checkbox in the PRD is `[x]`
# `parallel_group` is not a field either: parallel mode is retired
# (`retire-unused-loop-modes`), so nothing computes concurrency at all.

schema: 1

# REORDERED 2026-09-19 (operator's call): loop-measurement's remaining tasks are the
# before/after comparison for the loop-cost redesign, so the redesign lands
# first. Sequence: two quick fixes (grep-devnull-condition, loop-entry-routing),
# runstate-write-integrity-gaps (kept right after grep-devnull-condition, which
# edits the same file), then retire-autonomy-levels -> escalation-decider ->
# driver-context-window-default (so the "after" run measures driver context) ->
# loop-measurement. The guard/driver-mode holes and the other -gaps/expiry work
# follow; none of them affects the measurement. Order numbers in individual
# `why:` texts predate this and are historical.
features:
  - slug: run-metrics
    order: 0
    why: "retro-spec of shipped work (ADR 0019 v1-v3.4); ordered first so its derived-done state is what unblocks the three metrics features that depend on it"
    depends_on: []

  - slug: self-host-hardening
    order: 10
    why: "gates running the loop on this repo at all; the reflexive surface (guard, runstate, agent prompts) is editable here in a way it never is in a consumer repo, so this comes before any other self-driven work"
    depends_on: []

  - slug: self-host-hardening-gaps
    order: 15
    why: "three defects its parent's whole-branch review found; ordered first because two of them degrade every run until fixed — the load-timing model is wrong in the two documents every packet reads, and the packet rules shipped today may not reach the scoping agent at all, so later features get scoped under machinery that is still broken"
    depends_on: [self-host-hardening]

  - slug: loop-measurement
    order: 25
    why: "part 2 of the 2026-09-14 loop-cost redesign. Its OUTCOMES half (T1-T8) and the
      spend verb (T9-T11, T17) SHIPPED first, at order 16, because the redesign needed a true
      before: every packet the loop begins now records a start and a terminal outcome (27 of 98
      packets had none in the week ending 2026-09-14, and the loop had only ever recorded green
      and blocked), and /gaffer:metrics spend reports API-equivalent spend across sessions,
      projects and machines. Four of six capabilities are checked on that work.
      REORDERED 16 -> 24 on 2026-09-15 on the operator's call. What is left is the P1 spend-ANALYSIS
      tail: per-role cache-read shape and cache-write causes (T12-T13), --save/--combine across
      machines (T14-T15), and re-running the 2026-09-14 figures (T16). That work is a before/after
      comparison, so it is worth most AFTER the redesign lands, not before it - running it at
      order 16 would have measured a loop about to be replaced. Ordered here so it comes up when
      there is something to compare, rather than being marked deferred and never coming up at all.
      Takes over metrics-coverage-gaps' failed-and-uncommitted-packets capability"
    depends_on: [run-metrics]

  - slug: retire-unused-loop-modes
    order: 17
    why: "part 1 of the 2026-09-14 loop-cost redesign: removes relay (break-even at 40+ packets, largest run ever 14), --parallel (0 lanes in 151 recorded metric runs) and rate-limit auto-pause (never reliable), and replaces parallel mode's file-disjoint guarantee with guidance plus a same-file overlap count. Supersedes loop-cost-controls (retired) and closes coercive-pause-enforcement unbuilt. Ordered right after loop-measurement, so its effect is measured, and before the other redesign features (thin loop driver, implementer checkpoints, migrate alignment), which edit the same loop instructions this simplifies"
    depends_on: [run-metrics]

  - slug: retire-autonomy-levels
    order: 22
    why: "part of the 2026-09-14 loop-cost redesign: every repo on the operator's machine already runs full-autonomy and no lower level was ever used, so the four autonomy levels are removed and every repo is locked to what full-autonomy allows; always-denied git actions, the ASK tier and hard-deny floors are unchanged. Ordered after retire-unused-loop-modes, which removes other level references first, and before thin-loop-driver so the driver carries no level branching"
    depends_on: [retire-unused-loop-modes]

  - slug: thin-loop-driver
    order: 16
    why: "part 3 of the loop-cost redesign: the session running the loop enters driver mode (edits blocked on its main thread, handoff files, one-line status returns, mechanical routing on reviewer verdicts) so its context stays small over 10-20 hour runs; chains-and-charms-v2 main sessions cost $645/week API-equivalent at 150-290 turns each. PULLED FORWARD 2026-09-15 on the operator's call: the loop-measurement dependency was dropped because it is DERIVED-completion and loop-measurement's P1 spend tail (T12-T16) is deferred, so keeping it here would block this feature forever (ADR 0020 D2). The real dependency was only ever loop-measurement's OUTCOMES half (T1-T8), which this feature's capabilities cite by name and which lands first; the spend half shares no files with it. retire-autonomy-levels dropped too: ordering the level-deletion first was a convenience, not a dependency. MOVED 22 -> 16 on 2026-09-15 on the operator's call, into the slot loop-measurement vacated: runstate-write-integrity-gaps (20) and retire-autonomy-levels (21) both sat in front of it, and the driver's absence is the live daily cost. Those two keep their order relative to each other; escalation-decider (23) still follows everything it depends on, since dependencies gate scheduling independently of order"
    depends_on: [retire-unused-loop-modes]

  - slug: thin-loop-driver-gaps
    order: 17
    why: "ten defects its parent's end-of-run whole-branch review found, plus four gaps hit while actually driving the loop on 2026-09-16. Ordered immediately behind thin-loop-driver on the precedent self-host-hardening-gaps set at 15: three of them degrade EVERY run until fixed rather than a future one — an awk -v interpolation corrupts the run digest on ordinary gspec task prose, a packet continued in the same run renders two contradictory glyphs AND writes a false interrupted record to the append-only outcomes log, and CLAUDE.md still carries a report-shape rule that templates/report-conventions.md has superseded, in the file the harness obeys as a standing instruction. Ties with retire-unused-loop-modes (17), which is complete and yields no packets, so the tie is inert. NOT folded into the parent as unchecked capabilities: completion is derived from capability checkboxes, so a known hole in a shipped feature must be a separate feature or the parent reads incomplete and blocks everything downstream forever. Scope decisions taken by the operator at filing: the compaction-threshold fix is BOTH suppressing the kickoff line when it is not in effect AND correcting the default 200000 -> 1000000; and the four driver-run gaps fold in here rather than becoming a second feature on the same surface"
    depends_on: [thin-loop-driver]

  - slug: guard-write-target-detection
    order: 27
    why: "closes the four target-detection gaps left by thin-loop-driver P0's driver-mode refusal, found in its whole-branch review and recorded as run-state finding driver-mode-shell-write-limits. Two are escapes: a literal `<<` inside a QUOTED argument on a multi-line command is read as a real heredoc start (detection runs on raw line text, before quote collapsing), so later lines are dropped from the scan and a main-thread write in them is never seen; and only the first heredoc per line is tracked, so a second heredoc's body is scanned as command text. Two are wrong-but-safe: `sed -e SCRIPT` is not told apart from a positional file arg in `sed -i` extraction, and Windows drive-letter paths are never compared against the `pwd -W`/`cygpath -m` spellings of the config roots, so a legitimate write under the repo's own .agents/ is refused on Git Bash. ARM 2 per ADR 0026, not an append to thin-loop-driver: that PRD's capability 1 scopes driver mode to 'the write forms the guard recognises' and its Assumptions accept that other forms are not refused, so these sit outside any unchecked capability there. Slug names its scope rather than stacking a second -gaps. Ordered into the slot thin-loop-driver vacated, ahead of escalation-decider (23): the decider builds further on driver mode, and an enforcement hole in the thing it builds on should close first. Detection only — explicitly NOT a general shell parser"
    depends_on: [thin-loop-driver]

  - slug: escalation-decider
    order: 23
    why: "part 4 of the loop-cost redesign: judgment calls the driver routes out go to a short-lived decider (the slimmed chief-engineer) that returns one next step, plus a periodic review keeping the findings index under its warning size (34,368 bytes in one repo) and a 160-character summary cap"
    depends_on: [thin-loop-driver, loop-measurement, retire-unused-loop-modes, retire-autonomy-levels]

  - slug: driver-mode-deletion-refusal
    order: 26
    why: "driver mode does not refuse main-thread DELETION, so the driving session can destroy repository files during a run — the one thing driver mode exists to stop. Measured 2026-09-15 by executing hooks/guard.sh against constructed payloads with a mark set and no agent_id: plain `rm`, `unlink`, `rmdir`, `shred` and git's own remove subcommand all returned rc=0 ALLOWED against a target outside `.agents/`, while `cp`, `mv`, `sed -i`, redirections, `install` and `ln -s` on the SAME target returned rc=2. A no-mark control returned rc=0 for cp, so the rc=2 results are the driver-mode refusal and not another tier, and a delete under `.agents/` returned rc=0, so the exemption already behaves. This is a MISSING VERB, which is why it is not an amendment to guard-write-target-detection (order 22): that feature's four gaps are mis-extracted targets of RECOGNISED forms, and its own Scope/Out says widening the recognised set is separate work while its Assumptions call an unrecognised form an accepted limit it does not close. Nor could it anchor onto thin-loop-driver under ADR 0026 arm 1: capability 1 is unchecked and the plan has unchecked tasks, but its wording — the guard refuses 'the shell write forms it recognises' and 'other commands without a recognised write form are not refused' — ACCEPTS this behaviour rather than covering it. That carve-out reads as written for neutral and read-only commands; deletion is a mutation, and the most destructive one. Two facts found during QA widen it slightly and are both verified: the long-flag forced and recursive spellings of rm are allowed TODAY (the hard-deny floor matches only the short-flag and combined short-flag forms), so long-form destructive deletes fall to this feature rather than the floor; and git's remove subcommand does NOT escape via the read-only git fast-path as first assumed — READ_ONLY_GIT has no entry for it, so that path is declined and it escapes for the same reason as the other four. Its real difficulty is that target extraction keys on the first word of a segment, so a two-word verb needs its subcommand excluded from the targets or the git form under `.agents/` could never be allowed. Ordered 24, between escalation-decider and packet-bundling, to sit beside its sibling at 22 while staying behind the driver-mode work it depends on. Shares the sanitization and extraction code with guard-write-target-detection, so whichever lands second rebases onto the other. No plan file — deferred work, decomposed when it comes up"
    depends_on: [thin-loop-driver]

  - slug: packet-bundling
    order: 17
    why: "the loop groups consecutive unchecked tasks of one feature that share file scope into ONE packet — one implementer dispatch, one review, one verification run, one commit carrying every member's trailer and checkbox. Tasks sharing files cannot run concurrently anyway, so today each pays to re-read the same large files: measured 2026-09-15 in the thin-loop-driver P0 run, the first single-task packet's implementer alone spent ~188k tokens largely loading the one script it then edited, and grouping ran 14 P0 tasks as 4 dispatches. Operator's call on 2026-09-15 (weekly token budget ~40% spent by Tuesday), and deliberately NOT folded into thin-loop-driver: doing so mid-run would have reopened the handoff and router contracts and delayed the P0 those savings depend on. Grouping is automatic — execution is gaffer's half of the ADR 0020 seam, so no plan marker and no per-run operator decision — with a conservative default cap so an upgrade changes nothing until opted into, and design-heavy tasks never bundled. Carries a REQUIRED collector fix as its own P0: metrics.sh emits ONE row per commit today (its trailer awk assigns pk=v per match, ~line 574), so commit 8f236af's five tasks read as one — without it, bundling degrades the measurement it exists to improve. Ordered after escalation-decider, which is part 4 of the redesign and already depended on; this is a cost optimisation on top of a driver loop that must first be complete. MOVED 26 -> 18 on 2026-09-17 on the operator's call: it is to be the next feature picked once completion-record-drift-gaps completes, and the weekly token budget makes the saving worth taking before the rest of the queue. 18 and NOT 19 because `features` sorts `-k2,2n -k1,1` — numeric order, then SLUG — and three incomplete features sit at 19 (loop-entry-routing, loop-prose-consistency-gaps, stale-finding-expiry) whose slugs all sort ahead of `packet-bundling`, so 19 would not win. No integer sits between 19 and 19, so completion-record-drift-gaps moved 19 -> 18 alongside it: at the same order the slug tie-break puts `completion-record-drift-gaps` first, so the in-flight feature keeps the pick until it completes and this one takes it immediately after. Nothing else at 18 is incomplete, and no other entry's relative position changed"
    depends_on: [thin-loop-driver]

  - slug: capability-auto-complete
    order: 17
    why: "the loop flips each TASK checkbox inside its packet commit but never the CAPABILITY checkbox once its last covering task lands, and the preflight/end-of-run drift scans only report it, so every finished feature ends with a manual flip (packet-bundling needed five by hand, b47d5cd). Operator's call 2026-09-17: when a feature is complete it should be marked completed. Deliberately reverses completion-record-drift's never-auto-flip decision, keeping a feature-scoped guard: any unchecked task with an unmatched covers: quote blocks every flip in that feature, and unjudgeable rows are still only reported. Ordered 17, the next pick, ahead of next-state-reporting-integrity (18): packet-bundling at 17 is complete, and this removes a chore every later feature would otherwise end with"
    depends_on: [completion-record-drift-gaps]

  - slug: next-state-reporting-integrity
    order: 18
    why: "cmd_next's two nothing-to-do tests (scripts/gspec-backlog.sh:713 and :718) are `printf | awk | grep -q .` used as if-conditions under the script-wide pipefail, so grep closing the pipe on its first match kills a still-writing awk with SIGPIPE and pipefail reports 141 in place of grep's success -- a TRUE condition read as FALSE, falling through to NEXT=none / REASON=all features complete for a backlog that is entirely blocked (713) or entirely deferred (718). Reproduced against this repo's real features output (18,756 bytes, 15 rows): 235 and 241 failures in 400 iterations over two runs, first at iteration 3, roughly 59%. Line 718 shows 0 in 400 only because its 733-byte payload fits one stdio flush -- a property of today's data, not of the code -- so both are fixed together. Consequence is the loop driver reading NEXT=/PLAN= at run-loop:159, concluding the backlog is finished, running the whole-branch review and setting status: done over work nobody built. Same construct class T1 of completion-record-drift-gaps removed from _capability_drift_for; those two are its only survivors in that file, so this is new work rather than a rework -- T1's criterion scoped the scan to its own function and cmd_capability_drift, and that scope was honoured. Fix shape already exists in-repo at migrate.sh:429 (_trailer_landed, producer stops itself) and runstate.sh:2177 (refuses head -1 on a live pipe, citing the trim-note flake). Also audits the condition-shaped survivors in runstate.sh (:869, :976, :1084) and comments :3154, which is correct only by accident of a trailing || true. Arm 2 under ADR 0026: the only plan with unchecked task lines is loop-measurement, whose two unchecked capabilities are the spend tail; gspec-adapter-consistency has no plan file AND forbids this in its own Scope Out (`Any change to what the adapter reads, reports, or writes`, plus `Anything in scripts/runstate.sh`) and in its `No observable behaviour of the adapter changes` capability. Named for its scope, not completion-record-drift-gaps-gaps -- ADR 0026 D2, -gaps does not stack. Ordered 18, second pick behind packet-bundling at 17, on the operator's call 2026-09-17: packet-bundling moved 18 -> 17 rather than renumbering the three incomplete features at 19, because bumping them to 20 would have pushed runstate-write-integrity-gaps to 21 where the order-then-slug tie-break puts retire-autonomy-levels ahead of it, silently reversing two entries nobody asked to move. At 17 and 18 nothing else incomplete sits, so no other entry's relative position changes"
    depends_on: [completion-record-drift-gaps]

  - slug: grep-devnull-condition
    order: 19
    why: "_dirty_has_reviewed_output in scripts/runstate.sh (~:3208-3246) ends in `| grep -E ... >/dev/null` and its exit status is the elif condition at ~:3283 in _reconcile_tree, reached only from cmd_reconcile -- the /gaffer:resume crash-recovery path. GNU grep detects a /dev/null stdout and stops at the first match exactly as -q does, so on a large dirty tree it exits while git status/tr/sed are still writing; under pipefail the pipeline reports the signal, the function reads FALSE, and reconcile picks discard over escalate for precisely the mixed tree (loop scratch plus reviewed output such as .gspec/memory/pending/) the function exists to protect. Recoverable (the discard is a stash), so Important not Critical. Probed 2026-09-18: 20/20 misfires with -q, 0/20 with >/dev/null on BSD grep and ugrep -- inert on macOS, live on Linux CI, Linux consumers and Git Bash. The in-function comment reasons `drop -q, redirect stdout` as the fix, which held only for non-GNU grep. Found by next-state-reporting-integrity's own end-of-run review as the one shape both of its source guards deliberately did not match; that plan is fully checked, so ADR 0026 arm 2 -- a new feature, named for its scope. Not a capability on runstate-write-integrity-gaps (its hazards are key addressing and decoding, and the guard widening spans both sweeps and the adapter, which that feature excludes). Scope, operator's call 2026-09-18: capture-then-here-string the check, widen PIPE_GREP_Q_RE in both sweeps to stdout-to-/dev/null AND options-after-pattern (`| grep pat -q`, GNU getopt permutes), fix ordered before detector, plus a GNU-grep reconcile case. Ordered 19 immediately after its parent and ahead of runstate-write-integrity-gaps (20), which edits the same file -- landing this first means it does not edit around a known-wrong condition. CORRECTION, measured 2026-09-19 (T1 review): the GNU-grep short-circuit claimed above was inferred, not observed, and the measurement refuted it -- the `>/dev/null` form does NOT misfire on GNU grep 3.8 or 3.11 (0/20 against a 414 KB listing, pre-change check escalating 20/20), because GNU grep drains a non-seekable stdin before exiting on a null stdout and only `-q` skips that drain. So the redirect form was inert on every grep in the toolchain, not live on Linux; it was replaced anyway as defensive hardening (its correctness rested on an undocumented courtesy one keystroke from `-q`) and the feature landed complete -- see the PRD Overview for the corrected account"
    depends_on: [next-state-reporting-integrity]

  - slug: report-render-conformance
    order: 18
    why: "the report contract is 606 lines across templates/report-conventions.md, report-templates.md and report-conventions-card.md, and its sweep checks only DELIVERY -- hook envelope validity, fail-open in four directions, L2-suppresses-L3, and a byte-comparison of the card's three copies. Nothing checks whether a rendered report obeys the contract, and that is where this repo's misses cluster: of 29 features 12 are the system observing or reporting its own state, 6 of those are -gaps, and four of the six were filed 2026-09-15/16/17/17. ADR 0023's rejection of a Stop-hook validator STANDS and is not reopened -- most turns are not reports and `is this a report?` is the judgement a regex cannot make. What is feasible instead: the loop's three shapes render from `runstate.sh run-digest`, machine output with a known grammar, so (a) the header tally's arithmetic moves out of the agent's head into the deterministic core, where it is unwrong by construction rather than untestable, and (b) a lint checks a rendered report's mechanical rules against the digest that produced it -- glyph vocabulary, one glyph per line, section headings reusing the tally's glyphs in its order, the header 🔀 figure equalling the body's decision-block count, no bare id without a plain-English title, no section written as `none`. It cannot check prose quality, whether a consequence clause states a consequence, or whether a kickoff's assumption is the one most likely to be wrong; those stay the reviewer's and the PRD says so. Operator's call 2026-09-17 after asking why the reports keep missing things: the diagnosis was under-mechanised rather than brittle -- where a number is computed by a script with a sweep it has been stable, where a contract is stated in prose across sites that must agree it drifts. Ordered 18 behind next-state-reporting-integrity, which shares that order and sorts first; both sit behind packet-bundling at 17, which makes every packet after it cheaper including this one"
    depends_on: [thin-loop-driver]

  - slug: stop-report-decision-liveness
    order: 19
    why: "found by report-render-conformance's own whole-branch review (run 20260918T201335-0662), routed ADR 0026 arm 2 because the parent is fully checked and no incomplete plan's capability covers it; operator accepted it 2026-09-18. run-tally counts every ask-operator decision for the whole run while report-templates.md says the 🔀 figure counts only still-awaiting ones, so after a resume answers a question the header reads one high, the honest body renders no block, and report-lint's decision-count rule flags the correct report. Two operator calls fix the meaning: 🔀 stays `a decision for you` (not `questions the run asked`), and a question stops counting once its packet has any later start, continuation or abandoned record -- dropping a packet is an answer. Small: run-tally, the template's two sentences, and core sweep cases. Ordered 19 directly behind its parent at 18"
    depends_on: [report-render-conformance]

  - slug: answered-question-expiry
    order: 20
    why: "found by stop-report-decision-liveness's own whole-branch review (run 20260918T214435-695b), routed ADR 0026 arm 2 because the parent is fully checked and the only open plan (loop-measurement) covers spend-report scope; operator accepted it 2026-09-18. The parent made run-tally's 🔀 figure count only still-awaiting questions, but the stop report's body renders its decision blocks from run-state's pending_questions, which pause carries forward whole and nothing ever prunes -- so a resumed run that stops a second time renders a block for an answered question the header no longer counts, and report-lint flags it. An entry has no timestamp to judge an answer against, and a packet-only join is wrong when one packet stops twice, so pause now stamps asked_at; an entry without it is kept (over-reporting is the safe direction). Operator also folded in the retry-past-limit stop, which the body renders as a decision and run-tally counted as 0 -- the third source of the same mismatch. Ordered 20 directly behind its parent at 19"
    depends_on: [stop-report-decision-liveness]

  - slug: held-gap-expiry
    order: 30
    why: "completing a feature is what files the next one: 6 of 29 features are -gaps, filed 2026-08-23 x2 then 2026-09-15, -16, -17 x2 -- two in August, four in three days -- while 16 of 29 features still have no plan, so the backlog is nowhere near draining. Today's ADR 0026 revision stopped the loop filing them autonomously (arm 2 ends at an operator question); this is the next step, on the operator's call 2026-09-17: an Important-severity gap goes to a HOLDING PEN rather than a proposal, and at each run's preflight every held gap is re-tested, the ones that no longer reproduce dropped with evidence recorded and the ones that still reproduce reported with their age. Gaps that later work incidentally fixed then disappear without anyone deciding. Precedent is in-repo and proven: .gspec/memory/pending/ holds 28 agent-written memories awaiting batch review by /gspec-memorize -- capture cheaply, decide later, in bulk. Four load-bearing constraints: a severity gate, since next-state-reporting-integrity is a reproduced ~59% misfire reporting a blocked backlog as `all features complete` and cannot sit in a pen; expiry demands POSITIVE evidence, ADR 0024's rule one level up, so a re-test that could not run is unknown and unknown keeps the gap; every held gap carries its own re-test when held -- a reproducing command, or a named concrete read where no command can reach it -- because a gap that cannot be re-tested can never expire, which is precisely what ADR 0024 removed; and the pen holds CANDIDATES not yet accepted as work, leaving it the moment the operator accepts one, so it is pre-backlog and never the shadow backlog competing with gspec that CLAUDE.md warns about. The re-test obeys preflight's standing rule: report, never halt. Ordered 19, first of that cohort by slug, behind packet-bundling (17), next-state-reporting-integrity and report-render-conformance (18)"
    depends_on: [completion-record-drift-gaps]

  - slug: run-state-cleanup
    order: 18
    why: "ADR 0024 + 0025, which migrate in the same skill pass; ordered before metrics-coverage-gaps because it changes the run-state the loop writes on every packet, so doing it first means the coverage-gaps work is not built on state about to be migrated"
    depends_on: []

  - slug: runstate-write-integrity
    order: 19
    why: "two live-fired corruption paths in the writer of the loop's ONLY durable state, found while running run-state-cleanup: `set` writes an unquoted YAML scalar (a packet-close note containing `: ` broke the parse), and `write` replaces the file with unvalidated stdin (a failed awk left a 26-byte stub). run-state is gitignored, so neither is recoverable by git. Ordered immediately after run-state-cleanup because that feature rewrites the packet-close sequence these paths sit in — fixing the writer first would collide with it, and fixing it later leaves every packet close running through a known corruption path. Also covers a third defect of the same shape: test-runstate.sh's YAML-parse assertions silently no-op on a host without PyYAML"
    depends_on: [run-state-cleanup]

  - slug: runstate-write-integrity-gaps
    order: 21
    why: "three defects its parent deliberately scoped out, all in scripts/runstate.sh and all still live: `set` is flat-top-level-only and silently appends a shadow key for a nested one (hit live on 2026-09-15, which had to route the cursor advance through `write`); the decode side was never unified, so four hand-written decoders must stay in step by hand against the parent's single encoder; and the pause sentinel's reason is still written unencoded. The parent's capabilities spoke only to the VALUE a write encodes — these are about WHICH KEY it lands on and the READ side that decodes it. Ordered immediately after it because they are the same surface, but separate because the parent is derived-done and ADR 0026 forbids reopening a completed record"
    depends_on: [runstate-write-integrity]


  - slug: gspec-adapter-consistency
    order: 32
    why: "three internal-consistency defects review found in scripts/gspec-backlog.sh during loop-measurement-t2, none of them a live break today: the three gspec plan-layout paths are enumerated in two places (ADR 0020 says exactly one, and gspec has moved these files twice); three copies of the task-line regex were left underived when loop-measurement-t2 unified the other three, one of them in cmd_check_task's flip awk, which is the plugin's ONLY write into gspec/ — a divergence there is a checkbox the loop believes it flipped and did not; and two sweep assertions pass for the wrong reason, certifying a gate their fixtures never exercise. Its only tie to loop-measurement is that loop-measurement-t2 introduced the shared pattern blocks these capabilities build on, and that task has LANDED - so no depends_on, matching the PRD. The remaining loop-measurement work is all spend.sh and touches no file here, so the original contention reason is spent"
    depends_on: []
  - slug: loop-prose-consistency
    order: 18
    why: "five shipped instructions in the loop's own prose that disagree with their declared authority or with measured reality, found by thin-loop-driver-gaps' end-of-run whole-run review. Ordered immediately behind that feature because two of the five are read on EVERY run and a wrong statement in a skill prompt is obeyed rather than noticed: an output-contract comment still names a SOURCE value the reader no longer emits, and the stop report's section order contradicts the conventions file it declares as its authority — in the same sentence that claims the table-of-contents property the order breaks. Prose plus two sweep cases, no mechanism change. Routed to ADR 0026 arm 2 because thin-loop-driver-gaps' plan is fully checked and nothing else in the backlog carries a capability covering it"
    depends_on: [thin-loop-driver-gaps]

  - slug: loop-prose-consistency-gaps
    order: 31
    why: "three defects the parent's own end-of-run whole-run review found, 2026-09-17. The sharp one is that the cleanup is now DEFENDED BY ITS OWN SWEEP: run-loop:101 correctly states SOURCE=repo|operator|unknown while :112 eleven lines below still reads 'When SOURCE reads gaffer-default or unknown', same pair in resume:81/:92 and report-templates:317 — and test-report-conventions.sh:255-262 asserts gaffer-default appears exactly once per file, so removing the stale clause fails the sweep. The exclusion was right when written (thin-loop-driver-gaps T5 kept both names so the suppression was real) and expired when T6 removed the branch. Also: T2's section-order case extracts BODY_B on a ^PAUSED anchor, so the comment-prefixed worked example falls outside it and reverting only the example leaves the sweep green (verified by mutation) — the example is what an agent copies; and run-loop's continuation trigger is now circular, :200 deferring to §3.3 and :255 deferring back, which is T5's criterion's cost rather than a defect against it. Arm 2 because the parent is derived-done: an unchecked capability on it would make shipped work read incomplete forever and block everything downstream. Ties with stale-finding-expiry at 19; neither depends on the other, and runstate-write-integrity at 19 is complete so that tie is inert"
    depends_on: [loop-prose-consistency]

  - slug: stale-finding-expiry
    order: 29
    why: "the loop can only expire a stale finding in the run that landed its last packet. run-loop §3.6 is the loop's ONLY drop path and drops a finding only 'for each STALE=yes line naming <landed>', so an entry whose packets all finished in an EARLIER run is never droppable by any future landing. The detector is already correct and already runs at every packet close — §3.6 builds FINISHED from task-status over ALL findings' packets — so only the drop rule is narrower than the detector feeding it. Measured at the close of the loop-prose-consistency run: STALE_COUNT=2, INDEX_BYTES=5647 against MAX_BYTES=4096, OVER_THRESHOLD=yes, so the loop reports its index over threshold on every packet close while holding two entries it structurally cannot drop, and run-state sits in the standing context so the cost recurs per dispatch. Expected shape is one clause. ADR 0024 capture-before-drop is UNCHANGED and applies at full strength to cross-run entries (operator's call 2026-09-17); the residual risk — judging capture from one line of summary for a run this session never saw — is stated in the PRD. Scoped narrowly to the drop rule at the packet boundary so it does not collide with escalation-decider (23), whose periodic-review capability would close this as a side effect but is blocked behind retire-autonomy-levels and is a whole new agent plus cadence where this is one clause"
    depends_on: [run-state-cleanup]

  - slug: loop-entry-routing
    order: 20
    why: "run-loop §2 routes on a run-state's EXISTENCE, not its STATUS -- 'if .agents/run-state.yaml exists, you are resuming' -- but resume §1 enumerates only paused, blocked and running, while templates/run-state.yaml documents a fourth, done ('backlog complete; nothing to resume'). So a run-loop invoked after a completed run is redirected into a skill with no branch for the state it finds; the correct action is §2's own fresh-run branch, since a done run-state has an empty cursor and empty pending. Hit live 2026-09-17 at the start of the loop-prose-consistency run, where the driver had to read status: done, decline the redirect by judgement, and build a new backlog through the adapter by hand -- including splicing the existing findings index into the new file, because write REPLACES and a dropped index line unlinks a body still on disk. Recurs at the start of EVERY run following a completed one, which is the normal case. Also covers an unrecognised status reading as a stop rather than silently taking either branch. Arm 2: the only plan with unchecked tasks is loop-measurement, whose two unchecked capabilities are the spend tail and cover neither this nor its siblings"
    depends_on: [thin-loop-driver]

  - slug: completion-record-drift
    order: 19
    why: "nothing detects a feature whose work is done but whose completion record is not. A capability flips only once every task whose covers: references it is checked, and nothing in the loop performs or checks that flip -- check-task writes TASK checkboxes only, and ADR 0026 bounds arm 1 with 'never touch capability checkboxes'. Because completion is DERIVED from capability boxes, such a feature reads incomplete forever: next keeps returning it, the run yields zero packets, everything downstream stays blocked. Missed silently in two consecutive runs (thin-loop-driver-gaps, loop-prose-consistency), caught both times only because a whole-run review happened to look; verified 2026-09-17 with 5 of 5 tasks checked against 0 of 5 capabilities. DETECT, NEVER FLIP is the central constraint, on failure-mode asymmetry (today's failure is loud and safe -- re-picked, zero packets, noticed; an auto-flip's is silent and unblocks everything behind a feature wrongly marked done) and on the ADR 0020 seam (noticing the record is inconsistent is the plugin's half, recording delivery is gspec's). Two detection points, because §4 fires only on backlog-complete and a run ending blocked or interrupted never reaches it -- the runs whose record is likeliest half-written. Per-capability, not per-feature, since features legitimately sit part-ticked. An unmatched covers: reads as cannot-judge, never drift. Reported, never blocking, like the existing preflight drift scan. Costs no new write, no new ADR and no new parsing"
    depends_on: [thin-loop-driver]

  - slug: completion-record-drift-gaps
    order: 18
    why: "four defects the parent's own end-of-run whole-run review found, 2026-09-17, routed to ADR 0026 arm 2 because the parent is derived-done and no plan in the backlog carries both an unchecked task line and an unchecked capability covering them (the only plan with unchecked tasks is loop-measurement, whose two are the deferred spend tail). The sharp one INVERTS the parent's own P0: gspec-backlog.sh:1518 reads `elif ! printf ... | grep -qx '0'`, and grep -q exits on first match closing the pipe, so a producer still mid-write takes rc 141 which pipefail reports instead of grep success -- the leading negation then turns a correct 'this capability still has an unchecked covering task' into a DRIFT line, a false positive in exactly the direction unjudgeable-never-drift forbids. Same mechanism as the trim-note flake CLAUDE.md records as having cost two sessions and once been wrongly ruled out, so the fix is made on the construct and a failed reproduction is not evidence against it. Also: skip a feature that reads as complete under the adapter's OWN derivation (total > 0 && total == checked, NOT a bare all-checked universal, which is vacuously true for a PRD with zero recognised capability lines -- the legacy case where the remaining unmatched-quote rows are the only signal), which is the operator's 2026-09-17 answer to the 34 permanently-unactionable unjudgeable rows arising from two retro-specced plans whose checked task blocks the immutability floor forbids rewriting; the §4 stop-report site names the section but not whether its line takes a glyph, risking a tallied glyph under an untallied section; and a latent anchoring divergence where _CAPABILITY_LINE_RE allows leading whitespace while _prd_capability requires column 0, for which documenting the asymmetry is an explicitly legitimate close. File-overlapping with gspec-adapter-consistency (same adapter pattern blocks, same sweep) but no dependency in either direction. MOVED 19 -> 18 on 2026-09-17, in flight, so that packet-bundling could join it at 18 and become the pick the moment this completes (see that entry). Behaviourally inert for this feature: it was already the pick at 19 — first by slug among the incomplete 19s — and at 18 it is first by slug among the incomplete 18s, everything else at 18 being complete. It now sorts numerically ahead of its own parent completion-record-drift (19, complete), which changes nothing: order is planning preference only and dependency gating is computed independently of it"
    depends_on: [completion-record-drift]

  - slug: plugin-root-write-refusal
    order: 28
    why: "thin-loop-driver-gaps t4 narrowed driver mode's write refusal correctly, and in a CONSUMER repo that incidentally removed the only thing refusing writes to the installed plugin's own guard, hook bodies and agent/skill prompts — which sit outside the driven repository and are not a discovered config root. A hook body is spawned per event, so such an edit takes effect mid-run, and no other tier covers it: this is the control over the control. The control-weakened-in-aggregate class that only a whole-run review sees, not a defect against t4's criterion. Beside driver-mode-deletion-refusal (24) and guard-write-target-detection (22) on the same surface and sharing their sanitization code, so whichever lands second rebases. NOTE the trap recorded in its PRD: the pattern must never match this repository's own working tree — hardening the guard here was proposed and rejected, because this repo exists to develop it. The self-host face (a second checkout of this repo holding the plugin) was folded in at filing and then DEFERRED on measurement: the sensitive tier matches the raw path with no root awareness, two checkouts are byte-identical below their roots, so the only discriminator is an absolute root prefix — which would be committed machine-specific junk or untracked-and-unignored, and the latter is swept by the pause stash and discarded by reconcile as scratch"
    depends_on: [thin-loop-driver-gaps]

  - slug: driver-context-window-default
    order: 24
    why: "thin-loop-driver's own success metric, totals.driver_mode_context, now reads unmeasured on every run in any repo that has not explicitly set a compaction window — which is the default state. Two individually-correct thin-loop-driver-gaps packets caused it: t6 removed an invented 200000 default (right — ADR 0028 records 1m tokens as the default ON OPUS 5 (1M), model-conditional rather than harness-wide) and t5 made the kickoff state nothing when no value is in effect. Honest and better than the invented constant, but there is now no default path to measuring what the parent was built to measure. Scoped narrowly to ADR 0028's deferred plugin-default probe plus making the unmeasured REASON visible, and its hard constraint is that it must never reintroduce a guessed value: a number is reportable only with a SOURCE naming its provenance, and unknown stays a correct answer. Ordered last of the three because the probe needs operator-assisted live sessions an unattended packet cannot produce, and because a negative probe result — a plugin cannot supply one safely — is a legitimate outcome that leaves the metric opt-in"
    depends_on: [thin-loop-driver-gaps]

