name: ci

on:
  push:
  pull_request:

jobs:
  guardrail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY diagnostic — remove once the migrate backlog.done drop is fixed.
      # test-migrate.sh fails 13 cases on this runner and passes on macOS bash 3.2
      # and on five Ubuntu configurations (mawk, gawk, gawk+C.UTF-8, root,
      # non-root). Guessing at the difference has produced two false leads already,
      # so this prints the environment and runs the failing scenario directly.
      - name: DIAG — environment and the failing drop, in isolation
        run: |
          echo "== versions =="
          bash --version | head -1
          echo "awk -> $(readlink -f "$(command -v awk)")"; awk --version 2>&1 | head -1 || true
          git --version; echo "locale: LANG=${LANG:-unset} LC_ALL=${LC_ALL:-unset}"
          locale 2>/dev/null | head -3 || true
          echo "sed: $(sed --version 2>&1 | head -1)"
          echo "== the drop, run directly on a minimal fixture =="
          d=$(mktemp -d); mkdir -p "$d/.agents" "$d/gspec/tasks"
          printf 'schema: 3\nstatus: paused\nbacklog:\n  cursor: alpha-t2\n  done:\n    - alpha-t1\n  pending:\n    - alpha-t2\n' > "$d/.agents/run-state.yaml"
          printf -- '---\nspec-version: v1\nfeature: alpha\n---\n- [ ] **T2** **P0** t\n' > "$d/gspec/tasks/alpha.md"
          ( cd "$d" && git init -q . && git config user.email c@t && git config user.name c && git add -A && git commit -qm init )
          echo "-- detect --";  bash scripts/migrate.sh detect "$d" 2>&1 | grep -i backlog-done || echo "NO backlog-done FINDING"
          echo "-- apply --";   bash scripts/migrate.sh apply  "$d" 2>&1 | grep -iE 'DROPPED|UNRECOGNIZED' || echo "NO DROPPED LINE"
          echo "-- run-state after --"; cat "$d/.agents/run-state.yaml"
          echo "== the scan's own view =="
          awk 'function lead(l,  t){t=l; sub(/[^ ].*/,"",t); return length(t)}
               {printf "%2d |%s|\n", lead($0), $0}' "$d/.agents/run-state.yaml"

      # The sweeps assert a REAL YAML parse after every mutating runstate.sh
      # subcommand. Until 2026-08-11 those assertions silently returned true when
      # PyYAML was absent, so a host without it reported a fully green sweep while
      # ~21 cases checked nothing (measured: 213/0 green vs 193/21 once the skip was
      # made loud). The sweeps now fail loudly instead — which makes PyYAML a
      # load-bearing CI dependency for the first time, so declare it here rather than
      # relying on whatever the runner image happens to ship. A verifier that cannot
      # verify must say so, and that applies to CI as much as to the sweep.
      - name: Verification prerequisites (PyYAML)
        run: |
          if ! python3 -c 'import yaml' 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-yaml
          fi
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: Guardrail regression sweep
        run: bash scripts/test-guard.sh

      - name: Pause/resume run-state sweep
        run: bash scripts/test-runstate.sh

      - name: Packet dependency-graph sweep (ADR 0016)
        run: bash scripts/test-packet-graph.sh

      - name: Worktree lane sweep (ADR 0016)
        run: bash scripts/test-worktree.sh

      - name: Cooperative-pause signal sweep (ADR 0017)
        run: bash scripts/test-pause.sh

      - name: Parallel cooperative-pause e2e choreography (ADR 0017)
        run: bash scripts/test-parallel-pause-e2e.sh

      - name: Run-metrics assembly sweep (ADR 0019)
        run: bash scripts/test-metrics.sh

      - name: gspec adapter sweep (ADR 0020)
        run: bash scripts/test-gspec-backlog.sh

      - name: Consumer-repo retrofit sweep (v2.0.0)
        run: bash scripts/test-migrate.sh

      - name: Report-conventions delivery sweep (L2/L3)
        run: bash scripts/test-report-conventions.sh

      - name: Validate plugin manifest & structure (best-effort)
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate .
          else
            echo "claude CLI not present on runner; skipping 'claude plugin validate'."
          fi
