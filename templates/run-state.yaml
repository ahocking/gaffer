# Orchestration run state — the durable checkpoint the guided loop resumes from.
# -----------------------------------------------------------------------------
# Written by `/gaffer:pause` at a SAFE checkpoint (a green commit on the
# feature branch — never mid-edit) and read by `/gaffer:resume` (or the
# Chief Engineer at session start). Because the loop runs inside a Claude Code
# session that ends when the laptop sleeps or Claude Desktop closes, this file is
# the ONLY memory that survives the session — keep it truthful and current.
# See ADR 0004, ADR 0009 (sequential), and ADR 0016 (parallel).
#
# WHERE IT LIVES. This file is **gitignored** local bookkeeping, not product
# history — it lives at `.agents/run-state.yaml` and persists on local disk across
# sessions. Gitignoring it is what lets the loop's discard (`git stash
# --include-untracked`) sweep scratch back to `last_green_commit` WITHOUT taking
# this record, keeps `git add -A` from committing it, and keeps it from dirtying
# the tree that `runstate.sh reconcile` inspects. (Trade-off vs the old worktree
# model: it is no longer git-tracked, so it does not travel across machines —
# resume is same-machine.)
#
# Copy this file to `.agents/run-state.yaml`, fill in the real values, keep the
# ONE block that matches `mode`, and delete the other block + these comments.

schema: 3

# Lifecycle status — the PRIMARY crash-vs-clean signal a resuming session reads.
#   running  the loop is mid-flight. Seeing this at the start of a FRESH session
#            means the previous session ended WITHOUT pausing — a crash, reboot,
#            sleep-death, or hard close. Resume must reconcile before continuing
#            (sequential: `reconcile`; parallel: `reconcile-parallel`). See ADR 0005.
#   paused   `/gaffer:pause` brought the run to a clean, verified rest state.
#   blocked  paused with a `blocking` question the human must answer first.
#   done     backlog complete; nothing to resume.
# Write it through `scripts/runstate.sh` so the update is atomic (temp + rename).
status: running

# ISO-8601 UTC of the last write. Informational — `status` is the crash signal.
updated_at: <YYYY-MM-DDThh:mm:ssZ>

# Execution mode (ADR 0016).
#   sequential  ONE packet in flight, in the single local checkout (ADR 0009).
#               Uses the `branch` / `last_green_commit` / `backlog` block below.
#   parallel    up to `max_parallel` file-disjoint packets in flight, each in its
#               own worktree lane. Uses the `max_parallel` / `graph` / `packets` /
#               `lanes` block. Requires `--parallel` and a built packet graph.
mode: sequential

# ═══════════════════════════════════════════════════════════════════════════
# SEQUENTIAL MODE  (mode: sequential)  — delete this block if mode: parallel
# ═══════════════════════════════════════════════════════════════════════════

# The feature branch this run lives on, in the single local checkout. Never
# main/master.
branch: orch/<task-id>

# The last GREEN checkpoint: a commit on `branch` where build+tests passed. A
# resume starts here; a pause guarantees the checkout's HEAD == this SHA and its
# tree is clean. Full 40-char SHA.
#
# WRITE-AHEAD RECOVERY. The loop commits the packet FIRST, then advances this
# file — so a crash in that window leaves an "orphan" green commit one ahead that
# this file doesn't yet know about. Every packet commit's message carries the
# trailer `[orch packet:<cursor>]`; on resume, `runstate.sh reconcile` adopts a
# single clean orphan whose trailer matches the cursor. See ADR 0005.
last_green_commit: <full-sha>

# Where we are in the backlog of task packets.
backlog:
  cursor: <feature-001-scope>          # next packet to pick up; null when done
  done:                                # packets completed AND committed green
    - <feature-000-scope>
  pending:                             # packets not yet started, in order
    - <feature-001-scope>
    - <feature-002-scope>

# ═══════════════════════════════════════════════════════════════════════════
# PARALLEL MODE  (mode: parallel, ADR 0016)  — delete this block if sequential
# ═══════════════════════════════════════════════════════════════════════════
# The DRIVER (the top-level scheduler session) is the SINGLE writer of this block;
# dispatched lane agents NEVER write run-state. `runstate.sh packets-by-status`,
# `lanes`, and `reconcile-parallel` read it.
#
# max_parallel: 5                       # cap on concurrent lanes (project-overrides
#                                       # max_parallel_packets; default 5)
# graph: .agents/packet-graph.yaml      # the DAG this run executes (built by
#                                       # /build-packet-dependency-tree)
# integration_branch: develop           # base lanes fork from and merge back to
#
# packets:                              # every packet in the run, with its state
#   - id: feature-001-scope
#     status: done                       # pending | running | done | blocked
#     depends_on: [feature-000-scope]    # ordering edges (from the graph)
#     lane: orch/feature-001-scope       # branch (== worktree) when running/done
#     last_green_commit: <full-sha>      # this packet's green tip
#     integrated: true                   # merged back into integration_branch yet?
#   - id: feature-002-scope
#     status: running
#     depends_on: []
#     lane: orch/feature-002-scope
#     last_green_commit: <full-sha>
#     integrated: false
#
# lanes:                                # the currently-active worktree lanes
#   - id: feature-002-scope
#     worktree: ../<repo>-worktrees/feature-002-scope
#     branch: orch/feature-002-scope
#     packet: feature-002-scope
#     last_green_commit: <full-sha>      # empty until the lane commits green
#     status: running                    # running | green | integrating | done

# ═══════════════════════════════════════════════════════════════════════════

# Questions the human must answer before blocked packets can proceed. Each is a
# produced check-in (ADR 0004); DELIVERY is the frontend's job, not the plugin's.
# severity: blocking = the loop cannot continue until answered;
#           high     = proceed on other packets, but this needs an answer soon;
#           normal   = informational / can wait.
pending_questions:
  - id: <q-001>
    severity: <blocking | high | normal>
    packet: <feature-001-scope>
    question: <what you need decided, in one or two sentences>

# Optional freeform note the resuming session should read first.
#
# ONE line about the CURRENT state. Overwrite it each packet — do NOT append, and do
# NOT add "earlier history" sections. Left to accumulate in a real run it reached
# 164,678 chars (87% of the whole file, ~41k tokens, 15 stacked histories), and every
# relay dispatch re-read all of it to recover the two facts ADR 0012 says a resuming
# coordinator needs: did it land, what is next.
#
# Budget: ~2000 bytes (ORCH_NOTE_MAX_BYTES). `runstate.sh trim-note <file>` enforces
# it, archiving the overflow to run-state-note-archive.md rather than dropping it.
note: <e.g. paused after feature-000 landed green; feature-001 blocked on q-001>
