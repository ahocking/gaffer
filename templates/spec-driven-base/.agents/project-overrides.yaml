# Per-project orchestration overrides for {{PROJECT_NAME}}
# -----------------------------------------------------------------------------
# The `gaffer` plugin ships sensible defaults (opus for reasoning/review,
# sonnet for implementation, an approval guardrail for risk common to any codebase
# — auth, secrets, migrations, deps, deploys, git history).
# This file lets THIS repo tune that behavior without editing the plugin.
# Everything here is optional — delete what you don't override.

project:
  name: {{PROJECT_NAME}}
  # One line; the chief-engineer uses this to frame requests.
  summary: {{PROJECT_PURPOSE}}

# Commands the implementer/reviewer run to verify work. Fill these in once the
# stack is chosen (see gspec/stack.md). Left blank, the agents will ask.
commands:
  build: ""        # e.g. "dotnet build", "npm run build", "cargo build"
  test: ""         # e.g. "dotnet test", "npm test", "pytest"
  lint: ""         # e.g. "npm run lint", "ruff check ."

# Conventional write scopes for scoped task packets. Narrow is better.
# Adjust to match this repo's real layout once it exists.
allowed_paths:
  backend:
    - "src/**"
    - "tests/**"
  frontend:
    - "web/**"
  docs:
    - "docs/**"
    - "gspec/**"
  specs:
    # gspec 3.x keeps a feature's whole folder under here -- prd.md, tasks.md,
    # and arch.md / design.html where they exist -- so this one glob covers what
    # a separate `gspec/tasks/**` entry used to. Add that entry back only if this
    # repo still has features in the pre-3.x flat layout.
    - "gspec/features/**"
    - ".agents/roadmap.yaml"

# ── UX preview loop ──────────────────────────────────────────────────────────
# How the ux-designer SEES the rendered UI. Omit this block entirely to
# auto-detect (Unity if ProjectSettings/ProjectVersion.txt or a Unity-style
# Packages/manifest.json exists; web if .claude/launch.json or a package.json dev
# script exists) with a **web** fallback — so existing web repos need no change.
# ux:
#   preview_mode: web        # web | unity | none  (web is the fallback default)
#   #   web   — boot the dev server (.claude/launch.json) + drive the DOM via the
#   #           Claude_Preview MCP.
#   #   unity — drive the ALREADY-OPEN Unity Editor via the Unity MCP; it cannot
#   #           boot the Editor itself.
#   #   none  — no rendered surface; work from source + pasted screenshots.
#   unity_mcp_server: ai-game-developer   # Unity only; must match .mcp.json. Leave
#                                         # as this default — the agent's generic
#                                         # tool grant (mcp__ai-game-developer__*)
#                                         # assumes this server name.

# Model-routing overrides (optional). Only list tasks whose default tier you want
# to change. Tiers: opus (reasoning/architecture/review/security),
# sonnet (implementation), haiku (summarization/docs).
model_routing: {}
  # example:
  # implementation: sonnet
  # security_review: opus

# Extra escalation triggers specific to this project, on top of the plugin's
# generic defaults (auth, secrets, DB schema/migrations, deps, deploys, git history).
# This is where domain risk lives — e.g. money movement for a financial app.
escalate_to_human_on: []
  # example:
  # - "changes to <domain-critical module>"

# Highest autonomy this repo will EVER allow the Chief Engineer to reach, no
# matter what a session env var or .agents/autonomy requests (ADR 0004 / 0006). The
# guardrail clamps the resolved level DOWN to this ceiling. Omit for no cap.
#   interactive   — every commit is human-gated here (most conservative)
#   supervised    — CE may auto-commit green work on a feature branch
#   autonomous    — CE may drive the loop across packets
#   full-autonomy — CE may also merge/rebase/push onto NON-main branches
# autonomy_ceiling: supervised

# Opt this repo OUT of the guardrail's ASK tier (ADR 0015). Default false.
# When true, the guard SKIPS all one-click "ask" prompts — routine-but-notable bash
# (dependency installs, migrations, deploys) AND review-worthy writes (auth CODE,
# CI/deploy config, appsettings) run WITHOUT interruption. The hard-deny floors are
# unaffected: secrets/.env/key material, `rm -rf`, history rewrite, and the git
# soft gates (commit/merge/push to main) still block exactly as before. Use this
# only in a repo where the reviewer + PR gate are your review boundary and the ask
# prompts are pure friction. Resolved restrictively — in a nested/multi-repo tree,
# EVERY discovered `.agents/` root must set it true or the prompts stay on.
# bypass-ask-tier: false

# The non-main integration branch for the single-checkout feature-branch workflow
# (ADR 0009). The guided loop cuts each packet's `orch/<task-id>` branch FROM this
# base, and at `full-autonomy` merges/rebases those branches back INTO it and pushes
# it for CI (ADR 0006). If unset, the loop falls back to `develop`, then
# `main`/`master`. main/master merges, releases, and the danger floor ALWAYS stay
# human, whatever this says. Recommended default for develop-flow repos:
integration_branch: develop

# How many `fix`/`retry` attempts `runstate.sh route` allows a packet before
# routing to the escalation decider (plugin thin-loop-driver T9). 1 when
# missing, invalid, or 0.
# packet_attempts: 1

# Pause the loop, exactly as /gaffer:pause does, once this many packets have
# ended since the loop last started or resumed (plugin thin-loop-driver T10,
# ADR 0028 result 2). Off when missing, invalid, or 0 -- a periodic pause
# stops an unattended run until someone resumes it, so it must never fire
# unasked.
# pause_every_packets: 10

# The largest number of tasks a bundle may hold (plugin packet-bundling T2).
# 1 when missing, invalid, zero or negative -- bundling is off until this
# repository raises it. A recommended starting value is 4; a larger value
# costs a larger review diff, and more discarded work when a bundle ends
# non-green.
# bundle_max_tasks: 4
